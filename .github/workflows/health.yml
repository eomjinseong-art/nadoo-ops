name: health
on:
  schedule:
    - cron: "45 23 * * 0-4"   # 08:45 KST Mon-Fri
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/health.py
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
