name: seo
on:
  schedule:
    - cron: "10 1 1 * *"   # 10:10 KST on the 1st
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/seo.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data && git commit -m "seo results $(date -u +%F)" && git push || echo "nothing to commit"
